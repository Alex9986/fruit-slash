<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>水果忍者 - Fruit Ninja</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none;
    background:#1B0000; font-family:'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; display:block; cursor:crosshair; touch-action:none; }

  .hidden { display:none !important; }

  /* ===== HUD ===== */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #score { position:absolute; top:14px; left:18px; font-size:44px; font-weight:900; color:#ffd54f;
    -webkit-text-stroke:3px #3a1300; text-shadow:0 3px 0 rgba(0,0,0,.55); }
  #best  { position:absolute; top:22px; right:18px; font-size:20px; font-weight:700; color:#e8e8e8;
    text-shadow:0 2px 4px rgba(0,0,0,.8); }
  #title { position:absolute; top:8px; left:50%; transform:translateX(-50%);
    font-family:'Chalkboard SE','Segoe Print','Comic Sans MS','STKaiti',cursive;
    font-size:34px; font-weight:900; font-style:italic; letter-spacing:2px; color:#ff8a3d;
    -webkit-text-stroke:2px #4a0000; text-shadow:0 3px 0 #7b1f00, 0 6px 14px rgba(0,0,0,.6);
    white-space:nowrap; }
  #lives { position:absolute; top:56px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
  .life { font-size:26px; font-weight:900; color:#ff1744; text-shadow:0 2px 4px rgba(0,0,0,.8); transition:opacity .3s, transform .3s; }
  .life.lost { opacity:.18; transform:scale(.75); }
  #timer { position:absolute; top:56px; left:50%; transform:translateX(-50%); font-size:28px; font-weight:900;
    color:#fff; -webkit-text-stroke:2px #3a1300; text-shadow:0 2px 4px rgba(0,0,0,.8); }
  #comboWrap { position:absolute; top:132px; left:50%; transform:translateX(-50%); width:220px; text-align:center; }
  #comboText { font-size:20px; font-weight:900; color:#ffd54f; -webkit-text-stroke:1.5px #4a1300;
    text-shadow:0 2px 6px rgba(0,0,0,.7); }
  #comboBar { height:8px; margin-top:4px; border-radius:4px; background:rgba(0,0,0,.5); overflow:hidden; }
  #comboFill { height:100%; width:100%; border-radius:4px; background:linear-gradient(90deg,#ffd54f,#ff8a3d);
    transition:width .1s linear; }
  #buffs { position:absolute; top:96px; left:50%; transform:translateX(-50%); display:flex; gap:14px;
    font-size:16px; font-weight:700; }
  #buffs span { padding:3px 10px; border-radius:12px; background:rgba(0,0,0,.5); }
  .buf-frozen { color:#5ac8fa; } .buf-double { color:#ff9500; } .buf-frenzy { color:#ff3b30; }
  .buf-magnet { color:#ff4081; } .buf-slowmo { color:#b388ff; }

  #hint { position:absolute; top:38%; width:100%; text-align:center; font-size:22px; color:rgba(255,255,255,.85);
    text-shadow:0 2px 6px rgba(0,0,0,.9); transition:opacity 1s; }

  /* ===== 静音按钮 ===== */
  #mute { position:fixed; right:16px; bottom:16px; z-index:20; width:46px; height:46px; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); background:rgba(0,0,0,.55); color:#fff; font-size:20px;
    cursor:pointer; }

  /* ===== 菜单 ===== */
  #menu { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:26px; background:rgba(20,5,0,.35); }
  #menu .title { font-family:'Chalkboard SE','Segoe Print','Comic Sans MS','STKaiti',cursive;
    font-size:88px; font-weight:900; font-style:italic; letter-spacing:6px; color:#ff8a3d;
    -webkit-text-stroke:3px #4a0000; text-shadow:0 5px 0 #7b1f00, 0 12px 26px rgba(0,0,0,.7);
    transform:rotate(-3deg); }
  #menu .sub { font-size:22px; color:#ffd54f; letter-spacing:14px; text-shadow:0 2px 6px rgba(0,0,0,.9); }
  #menu .bestline { font-size:16px; color:#ddd; text-shadow:0 2px 4px rgba(0,0,0,.9); }
  #menu .modes { display:flex; flex-direction:column; align-items:center; gap:16px; }
  #menu .modes .btn { font-size:22px; padding:12px 44px; }
  #menu .modes .btn.zen { background:linear-gradient(180deg,#8f6bff,#5b2fca);
    box-shadow:0 6px 0 #351778, 0 10px 20px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.3); }
  .mode-desc { font-size:14px; color:#bbb; text-shadow:0 1px 3px rgba(0,0,0,.9); }
  .btn { font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif; font-size:26px; font-weight:800;
    color:#fff; padding:14px 52px; border:none; border-radius:40px; cursor:pointer; pointer-events:auto;
    background:linear-gradient(180deg,#ff9d3d,#e65100);
    box-shadow:0 6px 0 #8c2f00, 0 10px 20px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.35);
    text-shadow:0 2px 0 rgba(0,0,0,.4); transition:transform .08s; }
  .btn:hover { filter:brightness(1.08); }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #8c2f00, 0 4px 10px rgba(0,0,0,.4); }
  .btn.ghost { background:linear-gradient(180deg,#5a5a5a,#262626); box-shadow:0 6px 0 #111, 0 10px 20px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.2); }
  @keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-12px); } }
  #menu .btn { animation:bounce 1.3s ease-in-out infinite; }

  /* ===== 游戏结束面板 ===== */
  #gameover { position:fixed; inset:0; z-index:15; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; background:rgba(0,0,0,.62); }
  #gameover h2 { font-family:'Chalkboard SE','Segoe Print','Comic Sans MS',cursive;
    font-size:52px; font-weight:900; color:#ff5252; -webkit-text-stroke:2px #3a0000;
    text-shadow:0 4px 0 #7b1f00, 0 10px 20px rgba(0,0,0,.7); }
  #gameover .panel { display:flex; flex-direction:column; align-items:center; gap:10px;
    background:linear-gradient(180deg,#3E2723,#26120d); border:3px solid #6d4c41; border-radius:18px;
    padding:28px 56px; box-shadow:0 18px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
  #finalScore { font-size:36px; font-weight:900; color:#ffd54f; text-shadow:0 2px 0 rgba(0,0,0,.6); }
  #finalBest  { font-size:20px; color:#ddd; }
  #newRec { font-size:22px; font-weight:900; color:#ffeb3b; animation:bounce 1s infinite; }
  #gameover .btns { display:flex; gap:18px; margin-top:8px; }
  #gameover .btn { font-size:20px; padding:12px 34px; pointer-events:auto; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="best">BEST 0</div>
  <div id="title">Fruit Ninja</div>
  <div id="lives">
    <span class="life">✕</span><span class="life">✕</span><span class="life">✕</span>
  </div>
  <div id="timer" class="hidden">90s</div>
  <div id="buffs"></div>
  <div id="comboWrap" class="hidden">
    <div id="comboText">COMBO x0</div>
    <div id="comboBar"><div id="comboFill"></div></div>
  </div>
  <div id="hint">滑动切割水果，避开炸弹！</div>
</div>

<button id="mute">🔊</button>

<div id="menu">
  <div class="title">Fruit Ninja</div>
  <div class="sub">水果忍者</div>
  <div class="bestline" id="menuBest">BEST 0</div>
  <div class="modes">
    <div>
      <button class="btn" id="classicBtn">经典模式</button>
      <div class="mode-desc">有炸弹 · 3 条命</div>
    </div>
    <div>
      <button class="btn zen" id="zenBtn">Zen 模式</button>
      <div class="mode-desc">无炸弹 · 90 秒挑战 · 不扣命</div>
    </div>
  </div>
</div>

<div id="gameover" class="hidden">
  <h2>游戏结束</h2>
  <div class="panel">
    <div id="finalScore">最终得分：0</div>
    <div id="finalBest">最高分：0</div>
    <div id="newRec" style="display:none">★ 新纪录！ ★</div>
    <div class="btns">
      <button class="btn" id="retryBtn">再来一次</button>
      <button class="btn ghost" id="newGameBtn">新游戏</button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ========================= 工具函数 ========================= */
const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;

/* ========================= Canvas ========================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ========================= 数据定义 ========================= */
const FRUIT_TYPES = [
  { key: 'watermelon', score: 3, r: 48, juice: '#ff4d6d' },
  { key: 'apple',      score: 1, r: 30, juice: '#ffe28a' },
  { key: 'orange',     score: 1, r: 30, juice: '#ffb020' },
  { key: 'banana',     score: 1, r: 34, juice: '#ffe680' },
  { key: 'pineapple',  score: 3, r: 40, juice: '#ffd54f' },
  { key: 'kiwi',       score: 2, r: 28, juice: '#8bc34a' },
  { key: 'peach',      score: 1, r: 30, juice: '#ffb6a3' },
  { key: 'lemon',      score: 2, r: 28, juice: '#fff176' },
];
const POWERUPS = {
  frozen:   { color: '#5ac8fa', label: '冰冻' },
  double:   { color: '#ff9500', label: '双倍' },
  frenzy:   { color: '#ff3b30', label: '狂热' },
  goldapple:{ color: '#ffd700', label: '+1 生命' },
  magnet:   { color: '#ff4081', label: '磁铁' },
  slowmo:   { color: '#b388ff', label: '慢动作' },
  bombclear:{ color: '#00e676', label: '炸弹清除' },
};
const POWERUP_KEYS = Object.keys(POWERUPS);
const KEY = 'fruitNinjaBest';

/* ========================= 游戏状态 ========================= */
let state = 'menu';        // menu | play | over
let mode = 'classic';      // classic | zen
let zenTime = 0;
let dying = false;         // play 内的死亡过渡
let gameOverDelay = 0;
let score = 0, best = 0, lives = 3;
let elapsed = 0, spawnTimer = 0;
let gameTime = 0, lastTs = 0;
let freezeTime = 0, doubleTime = 0, frenzyTime = 0;
let magnetTime = 0, slowTime = 0;
let globalCombo = 0, globalComboTimer = 0;
const COMBO_WINDOW = 2.5;
let flash = 0, redFlash = 0, shake = 0;

let fruits = [], halves = [], splashTexts = [];
const particles = [], freeParticles = [];
const MAX_PARTICLES = 300;
let lastPointer = null;
const blades = new Map();  // pointerId -> 刀（独立轨迹/连击）
let lineGroups = [], lineIdCounter = 1;

const G = () => H * 1.55;

function difficulty() {
  const t = elapsed;
  return {
    interval: clamp(0.9 - t * 0.012, 0.3, 0.9),
    count:    Math.min(4, 1 + Math.floor(t / 15)),
    speed:    clamp(1 + t * 0.015, 1, 1.9),
    bomb:     mode === 'zen' ? 0 : clamp(0.04 + t * 0.004, 0.04, 0.22),
    special:  0.12,
  };
}

/* ========================= DOM ========================= */
const scoreEl    = document.getElementById('score');
const bestEl     = document.getElementById('best');
const menuBestEl = document.getElementById('menuBest');
const buffsEl    = document.getElementById('buffs');
const hintEl     = document.getElementById('hint');
const lifeEls    = Array.from(document.querySelectorAll('#lives .life'));
const livesEl    = document.getElementById('lives');
const timerEl    = document.getElementById('timer');
const comboWrapEl = document.getElementById('comboWrap');
const comboTextEl = document.getElementById('comboText');
const comboFillEl = document.getElementById('comboFill');
const menuEl     = document.getElementById('menu');
const hudEl      = document.getElementById('hud');
const overEl     = document.getElementById('gameover');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl  = document.getElementById('finalBest');
const newRecEl     = document.getElementById('newRec');
const muteBtn      = document.getElementById('mute');
const classicBtn   = document.getElementById('classicBtn');
const zenBtn       = document.getElementById('zenBtn');
const retryBtn     = document.getElementById('retryBtn');
const newGameBtn   = document.getElementById('newGameBtn');

function updateHUD() {
  scoreEl.textContent = score;
  bestEl.textContent  = 'BEST ' + best;
  menuBestEl.textContent = 'BEST ' + best;
  for (let i = 0; i < lifeEls.length; i++) {
    lifeEls[i].classList.toggle('lost', i >= lives);
  }
}

function updateZenUI() {
  if (mode === 'zen') timerEl.textContent = Math.max(0, Math.ceil(zenTime)) + 's';
}

function updateComboUI() {
  if (globalCombo >= 2 && state === 'play') {
    comboWrapEl.classList.remove('hidden');
    comboTextEl.textContent = 'COMBO x' + globalCombo;
    comboFillEl.style.width = (globalComboTimer / COMBO_WINDOW * 100).toFixed(1) + '%';
  } else {
    comboWrapEl.classList.add('hidden');
  }
}

function updateBuffsHUD() {
  let html = '';
  if (freezeTime > 0) html += '<span class="buf-frozen">❄ 冰冻 ' + freezeTime.toFixed(1) + 's</span>';
  if (doubleTime > 0) html += '<span class="buf-double">×2 双倍 ' + doubleTime.toFixed(1) + 's</span>';
  if (frenzyTime > 0) html += '<span class="buf-frenzy">🔥 狂热 ' + frenzyTime.toFixed(1) + 's</span>';
  if (magnetTime > 0) html += '<span class="buf-magnet">🧲 磁铁 ' + magnetTime.toFixed(1) + 's</span>';
  if (slowTime > 0) html += '<span class="buf-slowmo">⏳ 慢动作 ' + slowTime.toFixed(1) + 's</span>';
  buffsEl.innerHTML = html;
}

/* ========================= 水果绘制 ========================= */
function drawWatermelon(ctx, r) {
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.15, 0, 0, r);
  g.addColorStop(0, '#81c784'); g.addColorStop(1, '#2e7d32');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = r * 0.14; ctx.lineCap = 'round';
  const xs = [-r * 0.62, -r * 0.31, 0, r * 0.31, r * 0.62];
  for (const sx of xs) {
    ctx.beginPath();
    ctx.moveTo(sx, -r);
    ctx.quadraticCurveTo(sx * 0.72, 0, sx, r);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.4, r * 0.35, r * 0.16, -0.7, 0, TAU); ctx.fill();
}

function drawApple(ctx, r) {
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.15, 0, 0, r);
  g.addColorStop(0, '#ff7b7b'); g.addColorStop(0.6, '#e53935'); g.addColorStop(1, '#b71c1c');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, r * 0.04, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = r * 0.1;
  ctx.beginPath(); ctx.arc(0, r * 0.5, r * 0.55, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  ctx.strokeStyle = '#5d4037'; ctx.lineWidth = r * 0.13; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -r * 0.72); ctx.quadraticCurveTo(r * 0.16, -r * 1.02, r * 0.3, -r * 0.9); ctx.stroke();
  ctx.fillStyle = '#43a047';
  ctx.beginPath(); ctx.ellipse(r * 0.3, -r * 0.92, r * 0.28, r * 0.14, 0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.28, r * 0.3, r * 0.15, -0.5, 0, TAU); ctx.fill();
}

function drawOrange(ctx, r) {
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#ffcc80'); g.addColorStop(1, '#ef6c00');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(160,70,0,0.4)';
  const dim = [[0,0.5],[0.9,0.55],[2.1,0.6],[3.2,0.4],[4.1,0.65],[5.3,0.45],[1.5,0.3],[2.8,0.25],[4.6,0.3],[0.4,0.8],[2.5,0.85],[4.8,0.8]];
  for (const [a, d] of dim) {
    ctx.beginPath(); ctx.arc(Math.cos(a) * d * r, Math.sin(a) * d * r, r * 0.045, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#2e7d32';
  ctx.beginPath(); ctx.ellipse(r * 0.25, -r * 0.78, r * 0.22, r * 0.1, 0.3, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.3, r * 0.28, r * 0.15, -0.5, 0, TAU); ctx.fill();
}

function drawBananaShape(ctx, r, c1, c2) {
  ctx.save();
  const g = ctx.createLinearGradient(-r, -r * 0.5, r, r * 0.5);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.strokeStyle = g; ctx.lineWidth = r * 0.62; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(-r * 0.08, r * 0.06, r * 0.9, -1.05, 1.05);
  ctx.stroke();
  const e1x = -r * 0.08 + Math.cos(-1.05) * r * 0.9;
  const e1y =  r * 0.06 + Math.sin(-1.05) * r * 0.9;
  const e2x = -r * 0.08 + Math.cos(1.05)  * r * 0.9;
  const e2y =  r * 0.06 + Math.sin(1.05)  * r * 0.9;
  ctx.fillStyle = '#6d4c41';
  ctx.beginPath(); ctx.arc(e1x, e1y, r * 0.09, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(e2x, e2y, r * 0.09, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = r * 0.09;
  ctx.beginPath(); ctx.arc(-r * 0.08, r * 0.06, r * 0.8, -0.7, 0.15); ctx.stroke();
  ctx.restore();
}

function drawBanana(ctx, r) { drawBananaShape(ctx, r, '#fff176', '#f9a825'); }

function drawPineapple(ctx, r) {
  const g = ctx.createRadialGradient(-r * 0.2, -r * 0.1, r * 0.1, 0, r * 0.15, r * 0.9);
  g.addColorStop(0, '#ffd54f'); g.addColorStop(1, '#f9a825');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, r * 0.2, r * 0.8, r * 0.9, 0, 0, TAU); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, r * 0.2, r * 0.8, r * 0.9, 0, 0, TAU); ctx.clip();
  ctx.strokeStyle = 'rgba(120,80,0,0.45)'; ctx.lineWidth = r * 0.05;
  for (let x = -r; x <= r + 1; x += r * 0.35) {
    ctx.beginPath(); ctx.moveTo(x, -r); ctx.lineTo(x, r * 1.4); ctx.stroke();
  }
  for (let y = -r; y <= r * 1.4; y += r * 0.4) {
    ctx.beginPath(); ctx.moveTo(-r, y); ctx.lineTo(r, y); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#2e7d32';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * r * 0.16, -r * 0.35);
    ctx.quadraticCurveTo(i * r * 0.32, -r * 1.2, i * r * 0.6, -r * 1.3);
    ctx.quadraticCurveTo(i * r * 0.45, -r * 0.7, i * r * 0.2, -r * 0.28);
    ctx.closePath(); ctx.fill();
  }
}

function drawKiwi(ctx, r) {
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#8d6e63'); g.addColorStop(1, '#4e342e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.85, r * 0.95, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
  for (let i = 0; i < 26; i++) {
    const a = i / 26 * TAU;
    const x0 = Math.cos(a) * r * 0.84, y0 = Math.sin(a) * r * 0.94;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.cos(a) * 3, y0 + Math.sin(a) * 3); ctx.stroke();
  }
}

function drawPeach(ctx, r) {
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#ffccd5'); g.addColorStop(0.6, '#ff8fa3'); g.addColorStop(1, '#d64d66');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(-r * 0.24, r * 0.05, r * 0.68, 0, TAU);
  ctx.arc(r * 0.24, r * 0.05, r * 0.68, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(150,40,60,0.45)'; ctx.lineWidth = r * 0.08;
  ctx.beginPath(); ctx.moveTo(0, -r * 0.72); ctx.quadraticCurveTo(r * 0.09, r * 0.1, 0, r * 0.6); ctx.stroke();
  ctx.fillStyle = '#43a047';
  ctx.beginPath(); ctx.ellipse(r * 0.14, -r * 0.7, r * 0.3, r * 0.13, -0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(-r * 0.42, -r * 0.15, r * 0.26, r * 0.12, -0.5, 0, TAU); ctx.fill();
}

function drawLemon(ctx, r) {
  const g = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#fff9c4'); g.addColorStop(0.6, '#fdd835'); g.addColorStop(1, '#f9a825');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-r, 0);
  ctx.quadraticCurveTo(0, -r * 0.72, r, 0);
  ctx.quadraticCurveTo(0, r * 0.72, -r, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(180,140,0,0.35)';
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU, d = rand(0.2, 0.7);
    ctx.beginPath(); ctx.arc(Math.cos(a) * d * r, Math.sin(a) * d * r * 0.72, r * 0.04, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.25, r * 0.22, r * 0.1, -0.5, 0, TAU); ctx.fill();
}

function drawFruitShape(ctx, key, r) {
  switch (key) {
    case 'watermelon': drawWatermelon(ctx, r); break;
    case 'apple':      drawApple(ctx, r); break;
    case 'orange':     drawOrange(ctx, r); break;
    case 'banana':     drawBanana(ctx, r); break;
    case 'pineapple':  drawPineapple(ctx, r); break;
    case 'kiwi':       drawKiwi(ctx, r); break;
    case 'peach':      drawPeach(ctx, r); break;
    case 'lemon':      drawLemon(ctx, r); break;
  }
}

function drawGoldApple(ctx, r) {
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.15, 0, 0, r);
  g.addColorStop(0, '#fff176'); g.addColorStop(0.55, '#ffd54f'); g.addColorStop(1, '#f9a825');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, r * 0.04, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#5d4037'; ctx.lineWidth = r * 0.13; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -r * 0.72); ctx.quadraticCurveTo(r * 0.16, -r * 1.02, r * 0.3, -r * 0.9); ctx.stroke();
  ctx.fillStyle = '#43a047';
  ctx.beginPath(); ctx.ellipse(r * 0.3, -r * 0.92, r * 0.28, r * 0.14, 0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.28, r * 0.3, r * 0.15, -0.5, 0, TAU); ctx.fill();
  // 闪光
  const tw = Math.sin(gameTime * 6) * 0.5 + 0.5;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.globalAlpha = 0.4 + tw * 0.6;
  ctx.beginPath(); ctx.arc(r * 0.42, r * 0.36, r * 0.08 * (0.6 + tw), 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawSpecialIcon(ctx, kind, r) {
  ctx.save();
  ctx.fillStyle = '#fff';
  if (kind === 'double') {
    ctx.font = '900 ' + (r * 0.68) + 'px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×2', 0, r * 0.05);
  } else if (kind === 'frozen') {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.06; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI / 3;
      const cx = Math.cos(a), sy = Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(cx * r * 0.45, sy * r * 0.45);
      ctx.lineTo(-cx * r * 0.45, -sy * r * 0.45);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx * r * 0.45, sy * r * 0.45);
      ctx.lineTo(cx * r * 0.28 + Math.cos(a + 1.1) * r * 0.12, sy * r * 0.28 + Math.sin(a + 1.1) * r * 0.12);
      ctx.stroke();
    }
  } else if (kind === 'magnet') {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.09; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.3, r * 0.45);
    ctx.lineTo(-r * 0.3, -r * 0.1);
    ctx.quadraticCurveTo(-r * 0.3, -r * 0.4, 0, -r * 0.4);
    ctx.quadraticCurveTo(r * 0.3, -r * 0.4, r * 0.3, -r * 0.1);
    ctx.lineTo(r * 0.3, r * 0.45);
    ctx.stroke();
    ctx.fillStyle = '#ff1744'; ctx.fillRect(-r * 0.38, r * 0.14, r * 0.16, r * 0.33);
    ctx.fillStyle = '#2979ff'; ctx.fillRect(r * 0.22, r * 0.14, r * 0.16, r * 0.33);
  } else if (kind === 'slowmo') {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.07; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -r * 0.3);
    ctx.moveTo(0, 0); ctx.lineTo(r * 0.24, r * 0.05);
    ctx.stroke();
  } else if (kind === 'bombclear') {
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(0, r * 0.08, r * 0.38, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath(); ctx.arc(r * 0.12, -r * 0.18, r * 0.12, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#00e676'; ctx.lineWidth = r * 0.1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-r * 0.42, r * 0.46); ctx.lineTo(r * 0.42, -r * 0.46); ctx.stroke();
  } else { // frenzy 火焰
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.52);
    ctx.quadraticCurveTo(r * 0.36, -r * 0.05, r * 0.26, r * 0.32);
    ctx.quadraticCurveTo(r * 0.08, r * 0.5, -r * 0.12, r * 0.32);
    ctx.quadraticCurveTo(-r * 0.3, r * 0.05, -r * 0.26, -r * 0.12);
    ctx.quadraticCurveTo(-r * 0.22, -r * 0.4, 0, -r * 0.52);
    ctx.fill();
  }
  ctx.restore();
}

function drawSpecialBanana(ctx, r, kind) {
  if (kind === 'goldapple') {
    ctx.save();
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 18 + Math.sin(gameTime * 8) * 5;
    drawGoldApple(ctx, r);
    ctx.restore();
    return;
  }
  ctx.save();
  const col = POWERUPS[kind].color;
  const dark = { frozen: '#2b6cad', double: '#b36000', frenzy: '#b31200', magnet: '#a3004e', slowmo: '#6a3fd6', bombclear: '#007a3d' }[kind];
  ctx.shadowColor = col;
  ctx.shadowBlur = 20 + Math.sin(gameTime * 10) * 6;
  drawBananaShape(ctx, r, col, dark);
  ctx.restore();
  drawSpecialIcon(ctx, kind, r);
}

function drawBomb(ctx, r) {
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#555'); g.addColorStop(1, '#0a0a0a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.ellipse(-r * 0.32, -r * 0.35, r * 0.3, r * 0.16, -0.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = r * 0.12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.16, -r * 1.28, r * 0.38, -r * 1.18); ctx.stroke();
  const f = Math.sin(gameTime * 40) * 0.5 + 0.5;
  const sx = r * 0.38, sy = -r * 1.18;
  ctx.fillStyle = 'rgba(255,170,0,0.55)';
  ctx.beginPath(); ctx.arc(sx, sy, r * 0.26 * (0.6 + f * 0.5), 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath(); ctx.arc(sx, sy, r * 0.13 * (0.7 + f * 0.6), 0, TAU); ctx.fill();
}

function drawFruit(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.angle);
  if (f.bomb) drawBomb(ctx, f.r);
  else if (f.special) drawSpecialBanana(ctx, f.r, f.special);
  else drawFruitShape(ctx, f.type, f.r);
  ctx.restore();
}

function drawHalf(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.rotate(h.angle);
  ctx.beginPath();
  if (h.side > 0) ctx.rect(-h.r * 1.5, -h.r * 1.5, h.r * 3, h.r * 1.5);
  else ctx.rect(-h.r * 1.5, 0, h.r * 3, h.r * 1.5);
  ctx.clip();
  if (h.special) drawSpecialBanana(ctx, h.r, h.special);
  else drawFruitShape(ctx, h.type, h.r);
  ctx.restore();
}

/* ========================= 生成 ========================= */
function makeFruitObj(o) {
  const sp = o.sp !== undefined ? o.sp : difficulty().speed;
  const x  = o.x !== undefined ? o.x : W * (0.35 + Math.random() * 0.3);
  const y  = o.y !== undefined ? o.y : H + (o.r || 30);
  const vx = o.vx !== undefined ? o.vx : (Math.random() - 0.5) * H * 0.8 * sp;
  const vy = o.vy !== undefined ? o.vy : -rand(1.0, 1.45) * H * (0.7 + 0.3 * sp);
  return {
    x, y, vx, vy, r: o.r,
    type: o.type || null, special: o.special || null, bomb: !!o.bomb,
    state: 'alive', score: o.score || 0, juice: o.juice,
    angle: rand(0, TAU), rot: rand(-3, 3),
  };
}

function pickType() {
  return FRUIT_TYPES[randInt(0, FRUIT_TYPES.length - 1)];
}

function spawnSpecial() {
  const kind = POWERUP_KEYS[randInt(0, POWERUP_KEYS.length - 1)];
  fruits.push(makeFruitObj({ special: kind, r: 34, juice: POWERUPS[kind].color }));
}

function spawnFromBottom(d) {
  const roll = Math.random();
  if (mode !== 'zen' && roll < d.bomb) {
    fruits.push(makeFruitObj({ bomb: true, r: rand(26, 33), juice: '#333' }));
  } else if (roll < d.special) {
    spawnSpecial();
  } else {
    const t = pickType();
    fruits.push(makeFruitObj({ type: t.key, r: t.r * rand(0.9, 1.1), score: t.score, juice: t.juice }));
  }
}

function spawnFromEdge() {
  const sp = difficulty().speed;
  const side = randInt(0, 2);
  let x, y, vx, vy, r = 30;
  if (side === 0) {
    x = rand(0.1, 0.9) * W; y = -r;
    vx = (x < W / 2 ? 1 : -1) * rand(0.1, 0.4) * H * sp;
    vy = rand(0.45, 0.8) * H * sp;
  } else if (side === 1) {
    x = -r; y = rand(0.1, 0.6) * H;
    vx = rand(0.45, 0.85) * H * sp; vy = -rand(0.1, 0.35) * H * sp;
  } else {
    x = W + r; y = rand(0.1, 0.6) * H;
    vx = -rand(0.45, 0.85) * H * sp; vy = -rand(0.1, 0.35) * H * sp;
  }
  const roll = Math.random();
  if (mode !== 'zen' && roll < 0.1) {
    fruits.push(makeFruitObj({ x, y, vx, vy, bomb: true, r: rand(26, 33) }));
  } else if (roll < 0.2) {
    fruits.push(makeFruitObj({ x, y, vx, vy, special: POWERUP_KEYS[randInt(0, POWERUP_KEYS.length - 1)], r: 34, juice: '#fff' }));
  } else {
    const t = pickType();
    fruits.push(makeFruitObj({ x, y, vx, vy, type: t.key, r: t.r * rand(0.9, 1.1), score: t.score, juice: t.juice }));
  }
}

/* 直线连抛：3-4 个水果同一速度排成一条线，方便一刀全切 */
function spawnLineBurst() {
  const d = difficulty();
  const t = pickType();
  const r = t.r * rand(0.9, 1.1);
  const count = randInt(3, 4);
  const spacing = Math.min(r * 2.6, W * 0.22);
  const startX = W / 2 - ((count - 1) * spacing) / 2;
  const y = H + r;
  const sp = d.speed;
  const vy = -rand(1.0, 1.45) * H * (0.7 + 0.3 * sp);
  const vx = (Math.random() - 0.5) * H * 0.2 * sp; // 共同轻微漂移，保持一线
  const groupId = lineIdCounter++;
  lineGroups.push({ id: groupId, total: count, sliced: 0, missed: 0, countThisSwipe: 0, bestSwipe: 0, lastPos: null });
  for (let i = 0; i < count; i++) {
    const f = makeFruitObj({ x: startX + i * spacing, y, vx, vy, type: t.key, r, score: t.score, juice: t.juice });
    f.lineId = groupId;
    fruits.push(f);
  }
}

function findLineGroup(id) {
  for (let i = 0; i < lineGroups.length; i++) {
    if (lineGroups[i].id === id) return lineGroups[i];
  }
  return null;
}

function resolveLineGroup(g) {
  if (g.sliced + g.missed < g.total) return;
  const idx = lineGroups.indexOf(g);
  if (idx >= 0) lineGroups.splice(idx, 1);
  if (g.missed === 0 && g.sliced === g.total) {
    let bonus = g.total * 10;
    let label = 'Line!';
    if (g.bestSwipe === g.total) {
      bonus += g.total * 10;
      label = 'Perfect Line!';
    }
    if (doubleTime > 0) bonus *= 2;
    score += bonus;
    const pos = g.lastPos || { x: W / 2, y: H * 0.4 };
    addText(pos.x, pos.y - 40, label + ' +' + bonus, '#4dd0e1', 46);
    sfxCombo(g.total + 1);
  } else {
    // 没全切：整组算一次失误（扣一条命）
    const pos = g.lastPos || { x: W / 2, y: H * 0.35 };
    loseLife(pos);
  }
}

function spawnBurst(d) {
  // 时不时来一波直线连抛
  if (elapsed > 5 && Math.random() < 0.16) {
    spawnLineBurst();
    return;
  }
  let n = d.count;
  if (frenzyTime > 0) n += randInt(2, 4);
  for (let i = 0; i < n; i++) {
    if (frenzyTime > 0 && Math.random() < 0.55) spawnFromEdge();
    else spawnFromBottom(d);
  }
}

/* ========================= 粒子系统（对象池） ========================= */
function spawnParticle(o) {
  if (particles.length >= MAX_PARTICLES) return;
  const p = freeParticles.pop() || {};
  p.active = true;
  p.x = o.x; p.y = o.y; p.vx = o.vx; p.vy = o.vy;
  p.size = o.size; p.color = o.color;
  p.life = 0; p.max = o.max || 0.7; p.g = o.g || 0;
  p.fade = o.fade !== undefined ? o.fade : 1;
  particles.push(p);
}

function spawnJuice(f) {
  for (let i = 0; i < 18; i++) {
    const a = rand(0, TAU), sp = rand(60, 320);
    spawnParticle({
      x: f.x, y: f.y,
      vx: Math.cos(a) * sp + (f.vx || 0) * 0.3,
      vy: Math.sin(a) * sp - 60,
      size: rand(3, 8), color: f.juice, max: rand(0.5, 1.0), g: G() * 0.9,
    });
  }
  for (let i = 0; i < 4; i++) {
    const a = rand(0, TAU), sp = rand(40, 140);
    spawnParticle({
      x: f.x, y: f.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      size: rand(9, 15), color: f.juice, max: rand(0.4, 0.7), g: G() * 0.8,
    });
  }
}

function bombBlast(b, lethal) {
  flash = lethal ? 1 : 0.5;
  shake = lethal ? 1 : 0.4;
  sfxExplosion();
  for (let i = 0; i < 30; i++) {
    const a = rand(0, TAU), sp = rand(30, 160);
    spawnParticle({
      x: b.x, y: b.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      size: rand(10, 26), color: ['#3a3a3a', '#555', '#222'][randInt(0, 2)],
      max: rand(0.8, 1.4), g: -G() * 0.25,
    });
  }
  for (let i = 0; i < 26; i++) {
    const a = rand(0, TAU), sp = rand(120, 420);
    spawnParticle({
      x: b.x, y: b.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      size: rand(3, 7), color: Math.random() < 0.5 ? '#ffab00' : '#ff6d00',
      max: rand(0.3, 0.6), g: G() * 0.5,
    });
  }
  b.state = 'sliced';
  for (let i = fruits.length - 1; i >= 0; i--) {
    if (fruits[i] === b) { fruits.splice(i, 1); break; }
  }
  if (lethal) gameOver('bomb');
}

/* ========================= 浮动文字 ========================= */
function addText(x, y, text, color, size) {
  splashTexts.push({ x, y, text, color, size: size || 34, life: 0, max: 0.9, vy: -60 });
}

/* ========================= 切割 ========================= */
function segCircleHit(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = 0;
  if (len2 > 0) {
    t = ((cx - x1) * dx + (cy - y1) * dy) / len2;
    t = clamp(t, 0, 1);
  }
  const px = x1 + t * dx, py = y1 + t * dy;
  return (px - cx) * (px - cx) + (py - cy) * (py - cy) <= r * r;
}

function pointLineDist(cx, cy, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(cx - x1, cy - y1);
  const t = ((cx - x1) * dx + (cy - y1) * dy) / len2;
  const px = x1 + t * dx, py = y1 + t * dy;
  return Math.hypot(cx - px, cy - py);
}

function sliceFruit(f, p1, p2, blade) {
  const cutAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
  const normal = cutAngle + Math.PI / 2;
  const crit = pointLineDist(f.x, f.y, p1.x, p1.y, p2.x, p2.y) < f.r * 0.22;

  blade.swipe.push(f);
  blade.swipeLast = { x: f.x, y: f.y };
  const comboN = blade.swipe.length;

  // 全局连击：每次切开刷新窗口
  globalCombo++;
  globalComboTimer = COMBO_WINDOW;

  // 直线连抛组进度
  if (f.lineId) {
    const g = findLineGroup(f.lineId);
    if (g) {
      g.sliced++;
      g.countThisSwipe++;
      g.bestSwipe = Math.max(g.bestSwipe, g.countThisSwipe);
      g.lastPos = { x: f.x, y: f.y };
      resolveLineGroup(g);
    }
  }

  if (f.special) {
    applySpecial(f.special, f);
  } else {
    let pts = f.score * comboN + globalCombo;
    if (crit) pts *= 2;
    if (doubleTime > 0) pts *= 2;
    score += pts;
    addText(f.x, f.y - f.r * 0.4, '+' + pts, crit ? '#ffd54f' : '#ffffff', crit ? 40 : 30);
    if (crit) {
      addText(f.x, f.y - f.r * 1.6, 'Critical!', '#ffd54f', 42);
      sfxCombo(comboN);
    } else {
      sfxSlash();
    }
    if (comboN >= 3 && !blade.comboShown) {
      blade.comboShown = true;
      addText(f.x, f.y - f.r * 2.6, 'Combo x' + comboN + '!', '#ff5722', 50);
    }
  }

  // 两半飞散
  for (const side of [1, -1]) {
    halves.push({
      x: f.x, y: f.y,
      angle: cutAngle,
      angularVel: rand(3, 7) * side,
      vx: Math.cos(normal) * rand(120, 260) * side + (f.vx || 0) * 0.2,
      vy: Math.sin(normal) * rand(120, 260) * side + (f.vy || 0) * 0.3,
      r: f.r, type: f.type, special: f.special, side,
    });
  }
  spawnJuice(f);
  f.state = 'sliced';
}

function applySpecial(kind, f) {
  const col = POWERUPS[kind].color;
  addText(f.x, f.y - f.r * 0.5, POWERUPS[kind].label + '！', col, 44);
  sfxMagic();
  if (kind === 'frozen') freezeTime = 5;
  else if (kind === 'double') doubleTime = 8;
  else if (kind === 'frenzy') frenzyTime = 6;
  else if (kind === 'goldapple') {
    if (mode === 'zen') {
      score += 50;
      addText(f.x, f.y - f.r * 1.6, '+50', '#ffd700', 36);
    } else if (lives < 3) {
      lives++;
      updateHUD();
    } else {
      score += 20;
      addText(f.x, f.y - f.r * 1.6, '+20', '#ffd700', 32);
    }
  } else if (kind === 'magnet') magnetTime = 6;
  else if (kind === 'slowmo') slowTime = 4;
  else if (kind === 'bombclear') {
    for (let i = fruits.length - 1; i >= 0; i--) {
      if (fruits[i].bomb) bombBlast(fruits[i], false);
    }
  }
}

function checkSlice(p1, p2, blade) {
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    if (f.state !== 'alive') continue;
    if (segCircleHit(p1.x, p1.y, p2.x, p2.y, f.x, f.y, f.r)) {
      if (f.bomb) { bombBlast(f, true); return; }
      sliceFruit(f, p1, p2, blade);
      // 切过的移除
      fruits.splice(i, 1);
    }
  }
}

/* ========================= 漏水果 / 结束 ========================= */
function loseLife(f) {
  lives--;
  updateHUD();
  sfxMiss();
  addText(clamp(f.x, 60, W - 60), Math.min(f.y, H - 50), '-1', '#ff5252', 26);
  if (lives <= 0) gameOver('lives');
}

function onMiss(f) {
  if (f.bomb || f.special) return;
  // 漏水果会打断全局连击
  globalCombo = 0;
  globalComboTimer = 0;
  if (mode === 'zen') return; // Zen 不扣命
  if (f.lineId) {
    const g = findLineGroup(f.lineId);
    if (g) {
      if (!g.lastPos) g.lastPos = { x: f.x, y: f.y };
      g.missed++;
      resolveLineGroup(g);
    }
    return; // 直线组不逐只扣命，整组统一算一次失误
  }
  loseLife(f);
}

function gameOver(reason) {
  if (dying || state !== 'play') return;
  dying = true;
  gameOverDelay = reason === 'bomb' ? 1.0 : 0.7;
  if (reason !== 'bomb' && reason !== 'time') redFlash = 0.45;
}

function finalizeGameOver() {
  state = 'over';
  let newRecord = false;
  if (score > best) {
    best = score; newRecord = true;
    try { localStorage.setItem(KEY, String(best)); } catch (e) {}
  }
  finalScoreEl.textContent = '最终得分：' + score;
  finalBestEl.textContent = '最高分：' + best;
  newRecEl.style.display = newRecord ? 'block' : 'none';
  overEl.classList.remove('hidden');
  updateHUD();
}

/* ========================= 输入（多点触控，每根手指一把刀） ========================= */
canvas.addEventListener('pointerdown', function (e) {
  if (state !== 'play' || dying) return;
  ensureAudio();
  const blade = {
    lastP: { x: e.clientX, y: e.clientY },
    trail: [],
    swipe: [],
    comboShown: false,
    swipeLast: null,
  };
  blade.trail.push({ x: e.clientX, y: e.clientY, t: gameTime });
  blades.set(e.pointerId, blade);
  lastPointer = { x: e.clientX, y: e.clientY };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointermove', function (e) {
  const blade = blades.get(e.pointerId);
  if (!blade) return;
  const p = { x: e.clientX, y: e.clientY };
  lastPointer = p;
  const d = Math.hypot(p.x - blade.lastP.x, p.y - blade.lastP.y);
  blade.trail.push({ x: p.x, y: p.y, t: gameTime });
  if (blade.trail.length > 40) blade.trail.shift();
  if (d > 4) {
    checkSlice(blade.lastP, p, blade);
    blade.lastP = p;
  }
});

function endSwipe(blade) {
  for (let i = 0; i < lineGroups.length; i++) lineGroups[i].countThisSwipe = 0;
  if (blade.swipe.length >= 3) {
    const pos = blade.swipeLast || { x: W / 2, y: H / 2 };
    addText(pos.x, pos.y - 60, 'Combo x' + blade.swipe.length + '!', '#ff5722', 52);
    sfxCombo(blade.swipe.length);
  }
}

canvas.addEventListener('pointerup', function (e) {
  const blade = blades.get(e.pointerId);
  if (blade) {
    endSwipe(blade);
    blades.delete(e.pointerId);
  }
});
canvas.addEventListener('pointercancel', function (e) {
  const blade = blades.get(e.pointerId);
  if (blade) {
    endSwipe(blade);
    blades.delete(e.pointerId);
  }
});

/* ========================= 音频 ========================= */
let actx = null, master = null, noiseBuf = null, muted = false;
try { muted = localStorage.getItem('fruitNinjaMuted') === '1'; } catch (e) {}

function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(actx.destination);
    const len = actx.sampleRate * 0.2;
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
}

function playNote(freq, t, vol, dur) {
  if (!actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

function sfxSlash() {
  if (!actx) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf;
  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(2600, t);
  bp.frequency.exponentialRampToValueAtTime(600, t + 0.12);
  bp.Q.value = 1.2;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.4, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.16);
}

function sfxMiss() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(200, t);
  o.frequency.exponentialRampToValueAtTime(80, t + 0.3);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.4);
}

function sfxCombo(n) {
  if (!actx) return;
  const base = [523.25, 659.25, 783.99, 1046.5];
  const t = actx.currentTime;
  for (let i = 0; i < Math.min(n, 4); i++) {
    playNote(base[i], t + i * 0.07, 0.35, 0.25);
  }
}

function sfxExplosion() {
  if (!actx) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf;
  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(900, t);
  lp.frequency.exponentialRampToValueAtTime(60, t + 0.7);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.85);
  const o = actx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(30, t + 0.6);
  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.8, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  o.connect(g2); g2.connect(master);
  o.start(t); o.stop(t + 0.75);
}

function sfxMagic() {
  if (!actx) return;
  const t = actx.currentTime;
  const notes = [392, 523.25, 659.25, 783.99];
  for (let i = 0; i < notes.length; i++) playNote(notes[i], t + i * 0.06, 0.3, 0.3);
}

/* ---- BGM：日式五声音阶循环 ---- */
const BGM_PATTERN = [
  293.66, 0, 329.63, 349.23, 440, 0, 466.16, 440,
  349.23, 0, 329.63, 349.23, 293.66, 0, 246.94, 0,
];
const STEP_DUR = 0.24;
let bgmStep = 0, nextBgmTime = 0, bgmTimer = null;

function startBGM() {
  if (!actx || bgmTimer) return;
  nextBgmTime = actx.currentTime + 0.1;
  bgmTimer = setInterval(scheduleBGM, 60);
}

function scheduleBGM() {
  if (!actx) return;
  while (nextBgmTime < actx.currentTime + 0.2) {
    const n = BGM_PATTERN[bgmStep % BGM_PATTERN.length];
    if (n) playNote(n, nextBgmTime, 0.22, 0.6);
    if (bgmStep % 4 === 0) playNote(n * 0.5, nextBgmTime, 0.28, 0.9);
    nextBgmTime += STEP_DUR;
    bgmStep++;
  }
}

function toggleMute() {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.value = muted ? 0 : 0.9;
  try { localStorage.setItem('fruitNinjaMuted', muted ? '1' : '0'); } catch (e) {}
}
muteBtn.addEventListener('click', toggleMute);
muteBtn.textContent = muted ? '🔇' : '🔊';

/* ========================= 更新 ========================= */
function updateFruits(dt, ts) {
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    // 磁铁：把非炸弹水果吸向手指（强吸力，可对抗重力）
    if (magnetTime > 0 && lastPointer && f.state === 'alive' && !f.bomb) {
      const dx = lastPointer.x - f.x, dy = lastPointer.y - f.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 2) {
        const force = Math.min(2800, 2800 * 220 / (dist + 90));
        f.vx += (dx / dist) * force * dt;
        f.vy += (dy / dist) * force * dt;
        // 削弱远离手指方向的速度分量，让水果更容易被吸住
        const dot = (f.vx * dx + f.vy * dy) / dist;
        if (dot < 0) {
          f.vx += (dx / dist) * (-dot) * 0.55;
          f.vy += (dy / dist) * (-dot) * 0.55;
        }
        const spd = Math.hypot(f.vx, f.vy);
        if (spd > H * 1.9) { f.vx *= H * 1.9 / spd; f.vy *= H * 1.9 / spd; }
      }
    }
    f.x += f.vx * dt * ts;
    f.y += f.vy * dt * ts;
    f.vy += G() * dt * ts;
    f.angle += f.rot * dt * ts;
    if (f.y - f.r > H && f.vy > 0) {
      fruits.splice(i, 1);
      if (!dying) onMiss(f);
    }
  }
}

function updateHalves(dt, ts) {
  for (let i = halves.length - 1; i >= 0; i--) {
    const h = halves[i];
    h.x += h.vx * dt * ts;
    h.y += h.vy * dt * ts;
    h.vy += G() * dt * ts;
    h.angle += h.angularVel * dt * ts;
    if (h.y > H + 80 || h.x < -120 || h.x > W + 120) halves.splice(i, 1);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (!p.active) {
      if (freeParticles.length < 200) freeParticles.push(p);
      particles.splice(i, 1);
      continue;
    }
    p.life += dt;
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.life >= p.max || p.y > H + 60) p.active = false;
  }
}

function updateSplash(dt) {
  for (let i = splashTexts.length - 1; i >= 0; i--) {
    const t = splashTexts[i];
    t.life += dt;
    if (t.life >= t.max) splashTexts.splice(i, 1);
  }
}

function updateTrails() {
  blades.forEach(function (blade) {
    blade.trail = blade.trail.filter(function (p) { return gameTime - p.t < 0.3; });
  });
}

function update(dt) {
  gameTime += dt;
  const slow = slowTime > 0 ? 0.35 : 1;
  const sdt = dt * slow;

  if (state === 'play') {
    elapsed += sdt;
    if (!dying) {
      const d = difficulty();
      spawnTimer -= sdt;
      if (spawnTimer <= 0) {
        spawnBurst(d);
        spawnTimer += d.interval;
      }
    } else {
      gameOverDelay -= dt;
      if (gameOverDelay <= 0) finalizeGameOver();
    }

    // Zen 倒计时（真实时间）
    if (mode === 'zen' && !dying) {
      zenTime -= dt;
      if (zenTime <= 0) { zenTime = 0; gameOver('time'); }
      updateZenUI();
    }

    // 增益计时（真实时间）
    if (freezeTime > 0) freezeTime -= dt;
    if (doubleTime > 0) doubleTime -= dt;
    if (frenzyTime > 0) frenzyTime -= dt;
    if (magnetTime > 0) magnetTime -= dt;
    if (slowTime > 0) slowTime -= dt;
    if (freezeTime < 0) freezeTime = 0;
    if (doubleTime < 0) doubleTime = 0;
    if (frenzyTime < 0) frenzyTime = 0;
    if (magnetTime < 0) magnetTime = 0;
    if (slowTime < 0) slowTime = 0;

    const ts = freezeTime > 0 ? 0.5 : 1;
    updateFruits(sdt, ts);
    updateHalves(sdt, ts);
    updateBuffsHUD();
  }

  // 全局连击窗口
  if (globalComboTimer > 0) {
    globalComboTimer -= dt;
    if (globalComboTimer <= 0) { globalCombo = 0; globalComboTimer = 0; }
  }
  updateComboUI();

  updateParticles(sdt);
  updateSplash(sdt);
  updateTrails();

  if (flash > 0) flash -= dt * 2.2;
  if (shake > 0) shake -= dt * 2;
  if (redFlash > 0) redFlash -= dt * 1.5;
  if (flash < 0) flash = 0;
  if (shake < 0) shake = 0;
  if (redFlash < 0) redFlash = 0;
}

/* ========================= 渲染 ========================= */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3E2723');
  g.addColorStop(0.5, '#2a1612');
  g.addColorStop(1, '#1B0000');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 木板接缝
  ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  ctx.lineWidth = 2;
  const ph = 92;
  for (let y = 0; y < H; y += ph) {
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
    const off = (y / ph % 2) * 130;
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    for (let x = off; x < W; x += 150) {
      ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, Math.min(y + ph - 2, H)); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  }
  // 轻微暗角
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function drawTrail() {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255,255,255,0.9)';
  ctx.shadowBlur = 12;
  blades.forEach(function (blade) {
    const trail = blade.trail;
    for (let i = 0; i < trail.length - 1; i++) {
      const a = trail[i], b = trail[i + 1];
      const age = (gameTime - b.t) / 0.3;
      const alpha = (1 - age) * 0.85;
      ctx.strokeStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = lerp(14, 2, age);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  });
  ctx.restore();
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (!p.active) continue;
    const pr = p.life / p.max;
    ctx.globalAlpha = p.fade * (1 - pr);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 - 0.5 * pr), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSplashTexts() {
  for (let i = 0; i < splashTexts.length; i++) {
    const t = splashTexts[i];
    const pr = t.life / t.max;
    const sc = Math.min(1, t.life * 8);
    const alpha = 1 - pr;
    ctx.save();
    ctx.translate(t.x, t.y + t.vy * t.life);
    ctx.scale(sc, sc);
    ctx.globalAlpha = alpha;
    ctx.font = '900 ' + t.size + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(t.text, 0, 0);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }
}

function render() {
  drawBackground();

  ctx.save();
  if (shake > 0) {
    const m = shake * 12;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  drawTrail();
  for (let i = 0; i < fruits.length; i++) drawFruit(fruits[i]);
  for (let i = 0; i < halves.length; i++) drawHalf(halves[i]);
  drawParticles();
  drawSplashTexts();
  ctx.restore();

  if (freezeTime > 0) {
    ctx.fillStyle = 'rgba(40,100,255,0.16)';
    ctx.fillRect(0, 0, W, H);
  }
  if (frenzyTime > 0) {
    ctx.fillStyle = 'rgba(255,40,40,0.12)';
    ctx.fillRect(0, 0, W, H);
  }
  if (doubleTime > 0) {
    const pulse = 0.3 + 0.4 * (Math.sin(gameTime * 6) * 0.5 + 0.5);
    ctx.strokeStyle = 'rgba(255,150,0,' + pulse.toFixed(3) + ')';
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, W - 10, H - 10);
  }
  if (slowTime > 0) {
    ctx.fillStyle = 'rgba(120,80,220,0.12)';
    ctx.fillRect(0, 0, W, H);
  }
  if (magnetTime > 0) {
    const pulse = 0.3 + 0.4 * (Math.sin(gameTime * 8) * 0.5 + 0.5);
    ctx.strokeStyle = 'rgba(255,64,129,' + pulse.toFixed(3) + ')';
    ctx.lineWidth = 8;
    ctx.strokeRect(8, 8, W - 16, H - 16);
    if (lastPointer) {
      const rr = 22 + Math.sin(gameTime * 10) * 6;
      ctx.strokeStyle = 'rgba(255,64,129,0.75)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(lastPointer.x, lastPointer.y, rr, 0, TAU);
      ctx.stroke();
    }
  }
  if (redFlash > 0) {
    ctx.fillStyle = 'rgba(255,0,0,' + (redFlash * 0.5).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + flash.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ========================= 主循环 ========================= */
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
  lastTs = ts;
  update(dt);
  render();
}

/* ========================= 流程控制 ========================= */
function startGame(m) {
  if (m) mode = m;
  ensureAudio();
  startBGM();
  state = 'play';
  dying = false;
  gameOverDelay = 0;
  score = 0;
  lives = 3;
  elapsed = 0;
  spawnTimer = 0.4;
  zenTime = 90;
  freezeTime = 0;
  doubleTime = 0;
  frenzyTime = 0;
  magnetTime = 0;
  slowTime = 0;
  globalCombo = 0;
  globalComboTimer = 0;
  flash = 0;
  redFlash = 0;
  shake = 0;
  fruits = [];
  halves = [];
  splashTexts = [];
  lineGroups = [];
  particles.length = 0;
  freeParticles.length = 0;
  blades.clear();
  lastPointer = null;
  menuEl.classList.add('hidden');
  overEl.classList.add('hidden');
  hudEl.classList.remove('hidden');
  livesEl.classList.toggle('hidden', mode === 'zen');
  timerEl.classList.toggle('hidden', mode !== 'zen');
  updateHUD();
  updateBuffsHUD();
  updateZenUI();
  updateComboUI();
  hintEl.style.opacity = 1;
  hintEl.textContent = mode === 'zen' ? 'Zen 模式：90 秒内尽情切！' : '滑动切割水果，避开炸弹！';
  setTimeout(function () { hintEl.style.opacity = 0; }, 3200);
}

function showMenu() {
  state = 'menu';
  menuEl.classList.remove('hidden');
  overEl.classList.add('hidden');
  hudEl.classList.add('hidden');
  updateHUD();
}

classicBtn.addEventListener('click', function () { startGame('classic'); });
zenBtn.addEventListener('click', function () { startGame('zen'); });
retryBtn.addEventListener('click', function () { startGame(); });
newGameBtn.addEventListener('click', showMenu);

/* ========================= 初始化 ========================= */
try { best = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
updateHUD();

requestAnimationFrame(loop);
})();
</script>
